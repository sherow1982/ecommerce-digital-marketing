# GitHub Pages Configuration
theme: jekyll-theme-minimal
title: E-Commerce Digital Marketing Portfolio
description: Professional Digital Marketing & E-Commerce Solutions for US, European, and Middle Eastern Markets
author: Sherif Salama
url: https://sherow1982.github.io/ecommerce-digital-marketing

# Repository
github_username: sherow1982
repository: sherow1982/ecommerce-digital-marketing

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md

# Show excerpts on index
show_excerpts: true

# Permalink
permalink: /:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
